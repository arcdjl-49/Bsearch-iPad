<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BSearch 查經（iPad）</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8c5e3b">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
  :root{
    --brown:#8c5e3b;
    --brown-dark:#6e4a2e;
    --cream:#f7f3ec;
    --ink:#2a2420;
    --line:#e2d9c9;
    --accent:#a8402a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system, "PingFang TC", "Helvetica Neue", sans-serif;
    background:var(--cream);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    overscroll-behavior:none;
  }
  header{
    background:var(--brown);
    color:#fff;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  header h1{font-size:1.05em;margin:0;font-weight:600;white-space:nowrap;}
  header h1 small{font-size:10px;font-weight:400;opacity:.7;margin-left:6px;}
  .hdr-spacer{flex:1;}
  header button{
    background:rgba(255,255,255,.15);
    border:none;color:#fff;
    padding:8px 12px;border-radius:8px;
    font-size:.95em;
  }
  header button.icon-btn{font-size:1.15em;padding:6px 10px;line-height:1.2;}
  header button.active{background:rgba(255,255,255,.38);}
  header select{
    background:rgba(255,255,255,.15);
    border:none;color:#fff;
    padding:8px 10px;border-radius:8px;
    font-size:.9em;font-weight:600;
    -webkit-appearance:none;appearance:none;
  }
  #main{flex:1;overflow:hidden;position:relative;}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;}
  .view.active{display:block;}

  /* ---- 书卷选单 ---- */
  #bookView{padding:16px;}
  .testament-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
  .testament-title{font-size:1em;color:var(--brown-dark);margin:0 4px 10px;font-weight:700;}
  .book-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .book-btn{
    padding:11px 6px;text-align:center;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    font-size:.82em;font-weight:600;color:var(--ink);
    line-height:1.3;
  }
  .book-btn .en3{color:#9a8b74;font-weight:500;margin-right:3px;}
  .book-btn:active{background:var(--accent);color:#fff;}
  .book-btn:active .en3{color:#fdd;}
  @media (max-width:700px){
    .testament-cols{grid-template-columns:1fr;gap:0;}
    .testament-title{margin-top:18px;}
  }

  /* ---- 章节选单（弹层） ---- */
  #chapterSheet{
    position:fixed;inset:0;background:rgba(0,0,0,.35);
    display:none;align-items:flex-end;z-index:50;
  }
  #chapterSheet.show{display:flex;}
  .sheet-panel{
    background:#fff;width:100%;max-height:70vh;border-radius:16px 16px 0 0;
    padding:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 16px);
    overflow-y:auto;
  }
  .sheet-title{font-weight:700;font-size:1.1em;margin-bottom:12px;}
  .chapter-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .chapter-btn{
    padding:10px 0;text-align:center;background:var(--cream);
    border-radius:8px;font-weight:600;font-size:.95em;
  }
  .chapter-btn:active{background:var(--accent);color:#fff;}

  /* ---- 阅读画面 ---- */
  #readView{overflow:hidden;}
  #readView.active{display:flex;flex-direction:column;}
  #readHead{flex-shrink:0;background:var(--cream);border-bottom:1px solid var(--line);}
  #readHead .inner{max-width:640px;margin:0 auto;padding:12px 20px 10px;}
  #readScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #readView .reader{max-width:640px;margin:0 auto;padding:16px 20px 24px;}
  #readView h2{font-size:1.3em;color:var(--brown-dark);margin:0;display:inline;}
  #readView .hdr-sel{
    -webkit-appearance:none;appearance:none;border:none;margin:0;
    background:transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238c5e3b'/></svg>") no-repeat right 2px center;
    font:inherit;font-weight:700;color:var(--brown-dark);
    padding:2px 18px 2px 0;border-bottom:1px dashed var(--line);border-radius:0;
  }
  #readView .hdr-sel.chap{font-size:.9em;font-weight:600;color:#8a7f6e;margin-left:10px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23999'/></svg>");}
  .ext-links{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;}
  .ext-label{font-size:.82em;color:#9a8b74;margin-right:2px;}
  .ext-btn{
    display:inline-block;padding:5px 12px;border:1px solid var(--line);border-radius:16px;
    font-size:.82em;font-weight:600;color:var(--brown-dark);background:var(--cream);
    text-decoration:none;
  }
  .ext-btn:active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .verse{display:block;margin-bottom:.55em;line-height:1.9;font-size:1.08em;}
  .verse .vn{color:var(--accent);font-weight:700;font-size:.78em;margin-right:.3em;vertical-align:1px;}
  .verse.hit{background:linear-gradient(transparent 12%,#fff3b0 12%,#fff3b0 88%,transparent 88%);}
  .verse.selected{background:#eee2c8;border-radius:4px;}
  .verse.copied{background:#c8e6c9;}
  
  .chapnav{
    display:flex;justify-content:space-between;max-width:640px;margin:0 auto;padding:0 20px 30px;
  }
  .chapnav button{
    flex:1;margin:0 6px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:1em;
  }
  .chapnav button:disabled{opacity:.35;}

  /* ---- 检索画面 ---- */
  #searchView{padding:16px;}
  .scope-panel{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:14px;
  }
  .scope-title{font-weight:700;font-size:.9em;color:var(--brown-dark);margin-bottom:8px;}
  .scope-quickbtns{display:flex;gap:8px;margin-bottom:10px;}
  .scope-quickbtns button{
    flex:1;padding:8px 0;border:1px solid var(--line);background:var(--cream);
    border-radius:8px;font-size:.85em;font-weight:600;color:var(--ink);
  }
  .scope-quickbtns button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .scope-list{
    max-height:120px;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:2px 10px;
    border-top:1px solid var(--line);padding-top:8px;
  }
  .scope-item{display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:.85em;}
  .scope-item input{flex-shrink:0;}
  .scope-item label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .scope-item label .en3{color:#9a8b74;font-weight:500;margin-right:3px;}
  .search-bar{display:flex;gap:8px;margin-bottom:6px;}
  .search-bar input{
    flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:1em;background:#fff;
  }
  .search-bar button{padding:0 18px;border:none;background:var(--accent);color:#fff;border-radius:10px;font-weight:700;}
  .script-hint{display:none;align-items:center;gap:8px;background:#fff3b0;border:1px solid #e6d27a;border-radius:10px;padding:7px 10px;margin-bottom:10px;font-size:.88em;}
  .script-hint.show{display:flex;}
  .script-hint span{flex:1;}
  .script-hint button{border:none;border-radius:8px;padding:6px 12px;font-weight:700;background:var(--accent);color:#fff;}
  .script-hint button.x{background:transparent;color:#8a7f6e;padding:6px 8px;}
  .search-hint{font-size:.82em;color:#8a7f6e;margin-bottom:14px;}
  .result-count{font-size:.9em;color:#6b5f4e;margin-bottom:10px;}
  .result-item{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;
  }
  .result-ref{color:var(--accent);font-weight:700;font-size:.92em;display:block;margin-bottom:4px;}
  .result-text{font-size:1em;line-height:1.7;}
  mark{background:#fff3b0;color:inherit;border-radius:2px;padding:0 1px;}

</style>
</head>
<body>

<header>
  <h1 id="headerTitle">BSearch 查經<small id="appVer"></small></h1>
  <button id="tabBooks" class="icon-btn active" aria-label="經卷" title="經卷">📖</button>
  <span class="hdr-spacer"></span>
  <button id="tabSearch" class="icon-btn" aria-label="檢索" title="檢索">🔍</button>
  <select id="versionSelect" aria-label="選擇版本"></select>
  <button id="fontMinus">A-</button>
  <button id="fontPlus">A+</button>
</header>

<div id="main">
  <!-- 书卷选单 -->
  <div id="bookView" class="view active">
    <div class="testament-cols">
      <div>
        <div class="testament-title">Old Testament 舊約</div>
        <div class="book-grid" id="otGrid"></div>
      </div>
      <div>
        <div class="testament-title">New Testament 新約</div>
        <div class="book-grid" id="ntGrid"></div>
      </div>
    </div>
  </div>

  <!-- 阅读画面 -->
  <div id="readView" class="view">
    <div id="readHead"><div class="inner" id="readHeadInner"></div></div>
    <div id="readScroll">
      <div class="reader" id="readerContent"></div>
      <div class="chapnav">
        <button id="prevChap">← 上一章</button>
        <button id="nextChap">下一章 →</button>
      </div>
    </div>
  </div>

  <!-- 检索画面 -->
  <div id="searchView" class="view">
    <div class="scope-panel">
      <div class="scope-title" id="scopeTitle">聖經檢索 經卷選擇</div>
      <div class="scope-quickbtns">
        <button data-scope="all">ALL</button>
        <button data-scope="ot">OT 舊約</button>
        <button data-scope="nt">NT 新約</button>
      </div>
      <div class="scope-list" id="scopeList"></div>
    </div>
    <div class="search-bar">
      <input id="searchInput" placeholder="例如：耶穌 (門徒|使徒) !法利賽" enterkeyhint="search">
      <button id="searchBtn">檢索</button>
    </div>
    <div class="script-hint" id="scriptHint"><span id="scriptHintMsg"></span><button id="scriptHintGo"></button><button class="x" id="scriptHintX" aria-label="close">✕</button></div>
    <div class="search-hint" id="searchHint">空格＝且　|＝或　!＝非　( )＝分組</div>
    <div class="result-count" id="resultCount"></div>
    <div id="resultList"></div>
  </div>
</div>

<div id="chapterSheet">
  <div class="sheet-panel">
    <div class="sheet-title" id="sheetBookName"></div>
    <div class="chapter-grid" id="sheetChapters"></div>
  </div>
</div>

<script src="data/wpCuvVerses.js"></script>
<script src="data/wpNcvVerses.js"></script>
<script src="data/wpKjvVerses.js"></script>
<script src="data/wpEsvVerses.js"></script>
<script src="data/wpCuvSimpVerses.js"></script>
<script src="data/zhjUrls.js"></script>
<script>
// ==================== 書卷基礎資料 ====================
const BOOK_LIST = [
  {id:"01",zh:"創世記",en3:"Gen",en:"Genesis",ot:1},{id:"02",zh:"出埃及記",en3:"Exo",en:"Exodus",ot:1},{id:"03",zh:"利未記",en3:"Lev",en:"Leviticus",ot:1},
  {id:"04",zh:"民數記",en3:"Num",en:"Numbers",ot:1},{id:"05",zh:"申命記",en3:"Deu",en:"Deuteronomy",ot:1},{id:"06",zh:"約書亞記",en3:"Jos",en:"Joshua",ot:1},
  {id:"07",zh:"士師記",en3:"Jdg",en:"Judges",ot:1},{id:"08",zh:"路得記",en3:"Rth",en:"Ruth",ot:1},{id:"09",zh:"撒母耳記上",en3:"1Sa",en:"1 Samuel",ot:1},
  {id:"10",zh:"撒母耳記下",en3:"2Sa",en:"2 Samuel",ot:1},{id:"11",zh:"列王紀上",en3:"1Ki",en:"1 Kings",ot:1},{id:"12",zh:"列王紀下",en3:"2Ki",en:"2 Kings",ot:1},
  {id:"13",zh:"歷代志上",en3:"1Ch",en:"1 Chronicles",ot:1},{id:"14",zh:"歷代志下",en3:"2Ch",en:"2 Chronicles",ot:1},{id:"15",zh:"以斯拉記",en3:"Ezr",en:"Ezra",ot:1},
  {id:"16",zh:"尼希米記",en3:"Neh",en:"Nehemiah",ot:1},{id:"17",zh:"以斯帖記",en3:"Est",en:"Esther",ot:1},{id:"18",zh:"約伯記",en3:"Job",en:"Job",ot:1},
  {id:"19",zh:"詩篇",en3:"Psa",en:"Psalms",ot:1},{id:"20",zh:"箴言",en3:"Pro",en:"Proverbs",ot:1},{id:"21",zh:"傳道書",en3:"Ecc",en:"Ecclesiastes",ot:1},
  {id:"22",zh:"雅歌",en3:"Son",en:"Song of Solomon",ot:1},{id:"23",zh:"以賽亞書",en3:"Isa",en:"Isaiah",ot:1},{id:"24",zh:"耶利米書",en3:"Jer",en:"Jeremiah",ot:1},
  {id:"25",zh:"耶利米哀歌",en3:"Lam",en:"Lamentations",ot:1},{id:"26",zh:"以西結書",en3:"Eze",en:"Ezekiel",ot:1},{id:"27",zh:"但以理書",en3:"Dan",en:"Daniel",ot:1},
  {id:"28",zh:"何西阿書",en3:"Hos",en:"Hosea",ot:1},{id:"29",zh:"約珥書",en3:"Joe",en:"Joel",ot:1},{id:"30",zh:"阿摩司書",en3:"Amo",en:"Amos",ot:1},
  {id:"31",zh:"俄巴底亞書",en3:"Oba",en:"Obadiah",ot:1},{id:"32",zh:"約拿書",en3:"Jon",en:"Jonah",ot:1},{id:"33",zh:"彌迦書",en3:"Mic",en:"Micah",ot:1},
  {id:"34",zh:"那鴻書",en3:"Nah",en:"Nahum",ot:1},{id:"35",zh:"哈巴谷書",en3:"Hab",en:"Habakkuk",ot:1},{id:"36",zh:"西番雅書",en3:"Zep",en:"Zephaniah",ot:1},
  {id:"37",zh:"哈該書",en3:"Hag",en:"Haggai",ot:1},{id:"38",zh:"撒迦利亞書",en3:"Zec",en:"Zechariah",ot:1},{id:"39",zh:"瑪拉基書",en3:"Mal",en:"Malachi",ot:1},
  {id:"40",zh:"馬太福音",en3:"Mat",en:"Matthew",ot:0},{id:"41",zh:"馬可福音",en3:"Mar",en:"Mark",ot:0},{id:"42",zh:"路加福音",en3:"Luk",en:"Luke",ot:0},
  {id:"43",zh:"約翰福音",en3:"Jhn",en:"John",ot:0},{id:"44",zh:"使徒行傳",en3:"Act",en:"Acts",ot:0},{id:"45",zh:"羅馬書",en3:"Rom",en:"Romans",ot:0},
  {id:"46",zh:"哥林多前書",en3:"1Co",en:"1 Corinthians",ot:0},{id:"47",zh:"哥林多後書",en3:"2Co",en:"2 Corinthians",ot:0},{id:"48",zh:"加拉太書",en3:"Gal",en:"Galatians",ot:0},
  {id:"49",zh:"以弗所書",en3:"Eph",en:"Ephesians",ot:0},{id:"50",zh:"腓立比書",en3:"Php",en:"Philippians",ot:0},{id:"51",zh:"歌羅西書",en3:"Col",en:"Colossians",ot:0},
  {id:"52",zh:"帖撒羅尼迦前書",en3:"1Th",en:"1 Thessalonians",ot:0},{id:"53",zh:"帖撒羅尼迦後書",en3:"2Th",en:"2 Thessalonians",ot:0},{id:"54",zh:"提摩太前書",en3:"1Ti",en:"1 Timothy",ot:0},
  {id:"55",zh:"提摩太後書",en3:"2Ti",en:"2 Timothy",ot:0},{id:"56",zh:"提多書",en3:"Tit",en:"Titus",ot:0},{id:"57",zh:"腓利門書",en3:"Phm",en:"Philemon",ot:0},
  {id:"58",zh:"希伯來書",en3:"Heb",en:"Hebrews",ot:0},{id:"59",zh:"雅各書",en3:"Jas",en:"James",ot:0},{id:"60",zh:"彼得前書",en3:"1Pe",en:"1 Peter",ot:0},
  {id:"61",zh:"彼得後書",en3:"2Pe",en:"2 Peter",ot:0},{id:"62",zh:"約翰壹書",en3:"1Jn",en:"1 John",ot:0},{id:"63",zh:"約翰貳書",en3:"2Jn",en:"2 John",ot:0},
  {id:"64",zh:"約翰參書",en3:"3Jn",en:"3 John",ot:0},{id:"65",zh:"猶大書",en3:"Jud",en:"Jude",ot:0},{id:"66",zh:"啟示錄",en3:"Rev",en:"Revelation",ot:0}
];

// ==================== 版本設定 ====================
const VERSIONS = [
  { key: "cuv",     label: "和合本（繁體）CUV", varName: "WPCUVVerses", script: "t" },
  { key: "cuvsimp", label: "和合本（简体）CUV", varName: "WPCUVSimpVerses", script: "s" },
  { key: "ncv",     label: "新譯本 NCV",         varName: "WPNCVVerses", script: "t" },
  { key: "kjv",     label: "KJV",                varName: "WPKJVVerses", en: true, script: "e" },
  { key: "esv",     label: "ESV",                varName: "WPESVVerses", en: true, script: "e" },
];
function getVersionData(key) {
  const v = VERSIONS.find(x => x.key === key);
  if (!v) return {};
  return (typeof window[v.varName] !== "undefined") ? window[v.varName] : {};
}

let currentVersionKey = localStorage.getItem("bsVersion") || VERSIONS[0].key;
if (!VERSIONS.some(v => v.key === currentVersionKey)) currentVersionKey = VERSIONS[0].key;

function VERSES() { return getVersionData(currentVersionKey); }
function isEnglishVersion() { const v = VERSIONS.find(x => x.key === currentVersionKey); return !!(v && v.en); }

function updateSearchLang() {
  const en = isEnglishVersion();
  const hint = document.getElementById("searchHint");
  if (hint) {
    if (hint.dataset.zh === undefined) hint.dataset.zh = hint.textContent;
    hint.textContent = en
      ? "Space = AND　| = OR　! = NOT　( ) = Group　* = Wildcard"
      : hint.dataset.zh;
  }
  const st = document.getElementById("scopeTitle");
  if (st) {
    if (st.dataset.zh === undefined) st.dataset.zh = st.textContent;
    st.textContent = en ? "Select Books to Query" : st.dataset.zh;
  }
  const btn = document.getElementById("searchBtn");
  if (btn) btn.textContent = en ? "Search" : "檢索";
  const inp = document.getElementById("searchInput");
  if (inp) {
    if (inp.dataset.ph === undefined) inp.dataset.ph = inp.placeholder;
    inp.placeholder = en ? "e.g. jesus(*postles|disciple*)!Pharisees)" : inp.dataset.ph;
  }
}

function renderVersionSelect() {
  const sel = document.getElementById("versionSelect");
  sel.innerHTML = "";
  VERSIONS.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.key;
    opt.textContent = v.label;
    sel.appendChild(opt);
  });
  sel.value = currentVersionKey;
  updateSearchLang();
  sel.onchange = () => {
    currentVersionKey = sel.value;
    localStorage.setItem("bsVersion", currentVersionKey);
    updateSearchLang();
    scriptHintDismissed = false; updateScriptHint();
    // 如果正在閱讀畫面，切版本後嘗試停在同一書卷/章節重新渲染
    if (current.bookId && document.getElementById("readView").classList.contains("active")) {
      openChapter(current.bookId, current.chapter);
    }
    // 如果檢索畫面有結果，重新搜一次
    if (document.getElementById("searchInput").value.trim()) runSearch();
  };
}

let current = { bookId: null, chapter: null };
let currentVerse = "1";   // 目前選到的節號，預設第1節

// ==================== 書卷選單 ====================
function renderBookGrid() {
  const otGrid = document.getElementById("otGrid");
  const ntGrid = document.getElementById("ntGrid");
  BOOK_LIST.forEach(b => {
    const btn = document.createElement("button");
    btn.className = "book-btn";
    btn.innerHTML = `${b.id} <span class="en3">${b.en3}</span>${b.zh}`;
    btn.onclick = () => openChapterSheet(b.id);
    (b.ot ? otGrid : ntGrid).appendChild(btn);
  });
}

function openChapterSheet(bookId) {
  const book = VERSES()[bookId];
  const meta = BOOK_LIST.find(b => b.id === bookId);
  document.getElementById("sheetBookName").textContent = meta ? meta.zh : bookId;
  const grid = document.getElementById("sheetChapters");
  grid.innerHTML = "";
  if (!book) {
    grid.innerHTML = "<div style='grid-column:1/-1;color:#999;'>這個書卷還沒有索引資料</div>";
  } else {
    Object.keys(book.chapters).sort((a,b)=>+a-+b).forEach(ch => {
      const btn = document.createElement("button");
      btn.className = "chapter-btn";
      btn.textContent = ch;
      btn.onclick = () => { closeChapterSheet(); openChapter(bookId, ch); };
      grid.appendChild(btn);
    });
  }
  document.getElementById("chapterSheet").classList.add("show");
}
function closeChapterSheet(){ document.getElementById("chapterSheet").classList.remove("show"); }
document.getElementById("chapterSheet").addEventListener("click", e => {
  if (e.target.id === "chapterSheet") closeChapterSheet();
});

// ==================== 外部參考資源（依目前書卷/章節動態組網址） ====================

function renderExternalLinks(bookId, chapter, verse) {
  const meta = BOOK_LIST.find(b => b.id === bookId);
  if (!meta) return "";
  let html = `<div class="ext-links"><span class="ext-label">網頁：</span>`;
  EXTERNAL_LINKS.forEach(link => {
    const url = link.build(meta, chapter, verse);
    if (!url) return;
    html += `<a class="ext-btn" href="${url}" target="_blank" rel="noopener noreferrer">${link.label}</a>`;
  });
  html += `</div>`;
  return html;
}

// ==================== 閱讀畫面 ====================
function openChapter(bookId, chapter, targetVerse) {
  current = { bookId, chapter: String(chapter) };
  currentVerse = "1";
  const book = VERSES()[bookId];
  const meta = BOOK_LIST.find(b => b.id === bookId);
  const chapterData = book && book.chapters[current.chapter];

  const box = document.getElementById("readerContent");
  const enHdr = isEnglishVersion(); // 英文版本：卷名與章號顯示英文
  const bookOpts = BOOK_LIST.map(b => `<option value="${b.id}"${b.id === bookId ? " selected" : ""}>${enHdr ? b.en : b.zh}</option>`).join("");
  const chKeys = book ? Object.keys(book.chapters).sort((a,b)=>+a-+b) : [current.chapter];
  const chOpts = chKeys.map(c => `<option value="${c}"${c === current.chapter ? " selected" : ""}>${enHdr ? "Chapter " + c : "第 " + c + " 章"}</option>`).join("");
  document.getElementById("readHeadInner").innerHTML =
    `<h2><select id="bookSel" class="hdr-sel" aria-label="經卷">${bookOpts}</select></h2>` +
    `<select id="chapSel" class="hdr-sel chap" aria-label="章">${chOpts}</select>` +
    `<div id="extLinksBox">${renderExternalLinks(bookId, current.chapter, currentVerse)}</div>`;
  const bookSel = document.getElementById("bookSel"), chapSel = document.getElementById("chapSel");
  bookSel.onchange = () => {
    const nb = VERSES()[bookSel.value];
    const first = nb ? Object.keys(nb.chapters).sort((a,b)=>+a-+b)[0] : "1";
    openChapter(bookSel.value, first || "1");
  };
  chapSel.onchange = () => openChapter(bookId, chapSel.value);
  let html = "";
  if (chapterData) {
    Object.keys(chapterData).sort((a,b)=>+a-+b).forEach(vn => {
      html += `<span class="verse" data-vn="${vn}"><span class="vn">${vn}</span>${escapeHtml(chapterData[vn])}</span>`;
    });
  } else {
    html += `<p style="color:#999;">這個版本找不到這一章的內容</p>`;
  }
  box.innerHTML = html;

  // 單擊：選取該節；雙擊：複製該節＋（卷名縮寫 章:節）
  box.querySelectorAll(".verse").forEach(el => {
    el.addEventListener("click", () => {
      box.querySelectorAll(".verse").forEach(v => v.classList.remove("selected"));
      el.classList.add("selected");
      currentVerse = el.dataset.vn;
      document.getElementById("extLinksBox").innerHTML =
        renderExternalLinks(current.bookId, current.chapter, currentVerse);
    });
    el.addEventListener("dblclick", () => {
      const vn = el.dataset.vn;
      const text = chapterData[vn];
      if (!text) return;
      const abbr = FHL_BOOK_BRF[parseInt(bookId, 10)] || meta.zh;
      const copyText = `${text}（${abbr} ${current.chapter}:${vn}）`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(copyText).then(() => {
          el.classList.add("copied");
          setTimeout(() => el.classList.remove("copied"), 400);
        }).catch(() => {});
      }
    });
  });

  updateChapNavButtons();
  switchView("readView");
  fitSelect(bookSel); fitSelect(chapSel);
  applyFontScale();
  document.getElementById("readScroll").scrollTop = 0;

  // 從檢索結果點進來：選取並捲動到指定節
  if (targetVerse) {
    const target = box.querySelector(`.verse[data-vn="${targetVerse}"]`);
    if (target) {
      target.classList.add("selected");
      currentVerse = String(targetVerse);
      document.getElementById("extLinksBox").innerHTML =
        renderExternalLinks(current.bookId, current.chapter, currentVerse);
      target.scrollIntoView({ block: "center" });
    }
  }
}

// 讓下拉選單寬度剛好等於目前選到的文字（原生 select 預設會撐到最長選項）
function fitSelect(sel) {
  const cs = getComputedStyle(sel);
  const sp = document.createElement("span");
  sp.style.cssText = `position:absolute;visibility:hidden;white-space:nowrap;font:${cs.font};`;
  sp.textContent = sel.options[sel.selectedIndex].text;
  document.body.appendChild(sp);
  sel.style.width = (sp.offsetWidth + 20) + "px";
  sp.remove();
}

function updateChapNavButtons(){
  const book = VERSES()[current.bookId];
  const chapters = book ? Object.keys(book.chapters).map(Number).sort((a,b)=>a-b) : [];
  const idx = chapters.indexOf(Number(current.chapter));
  document.getElementById("prevChap").disabled = idx <= 0;
  document.getElementById("nextChap").disabled = idx === -1 || idx >= chapters.length - 1;
  document.getElementById("prevChap").onclick = () => { if (idx > 0) openChapter(current.bookId, chapters[idx-1]); };
  document.getElementById("nextChap").onclick = () => { if (idx < chapters.length-1) openChapter(current.bookId, chapters[idx+1]); };
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ==================== 字體大小 ====================
let fontScale = parseInt(localStorage.getItem("bsFontScale")) || 100;
function applyFontScale(){
  document.querySelectorAll(".verse").forEach(el => el.style.fontSize = (fontScale/100*1.08) + "em");
  localStorage.setItem("bsFontScale", fontScale);
}
document.getElementById("fontMinus").onclick = () => { if(fontScale>70){fontScale-=10; applyFontScale();} };
document.getElementById("fontPlus").onclick = () => { if(fontScale<160){fontScale+=10; applyFontScale();} };

// ==================== 檢索範圍（經卷勾選） ====================
let activeScope = "all";          // 目前生效的分類："all" | "ot" | "nt" | null（手動勾選、不完全對應任何分類時）
let visibleScopeIds = BOOK_LIST.map(b => b.id); // 目前清單實際顯示的書卷id（依分類過濾）
let searchScope = new Set(visibleScopeIds);     // 目前被勾選、納入檢索的書卷id

function idsForMode(mode) {
  if (mode === "ot") return BOOK_LIST.filter(b => b.ot).map(b => b.id);
  if (mode === "nt") return BOOK_LIST.filter(b => !b.ot).map(b => b.id);
  return BOOK_LIST.map(b => b.id); // "all"
}

function renderScopeList() {
  const list = document.getElementById("scopeList");
  list.innerHTML = "";
  BOOK_LIST.forEach(b => {
    if (!visibleScopeIds.includes(b.id)) return; // 過濾成只顯示目前分類的書卷
    const item = document.createElement("div");
    item.className = "scope-item";
    const cbId = "scope_" + b.id;
    item.innerHTML = `<input type="checkbox" id="${cbId}" ${searchScope.has(b.id) ? "checked" : ""}>
      <label for="${cbId}">${b.id} <span class="en3">${b.en3}</span>${b.zh}</label>`;
    item.querySelector("input").addEventListener("change", (e) => {
      if (e.target.checked) searchScope.add(b.id); else searchScope.delete(b.id);
      activeScope = null; // 手動改動後不再視為完全對應某個分類按鈕
      updateScopeQuickBtnState();
    });
    list.appendChild(item);
  });
}

function setScope(mode) {
  const ids = idsForMode(mode);
  if (activeScope === mode) {
    // 再次點擊目前已生效的分類按鈕 → 清除該分類的勾選（清單維持顯示，但全部取消勾）
    ids.forEach(id => searchScope.delete(id));
    activeScope = null;
  } else {
    // 切到新分類 → 清單過濾成只顯示這個分類，且預設全選
    visibleScopeIds = ids;
    searchScope = new Set(ids);
    activeScope = mode;
  }
  renderScopeList();
  updateScopeQuickBtnState();
}

function updateScopeQuickBtnState() {
  document.querySelectorAll(".scope-quickbtns button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.scope === activeScope);
  });
}

document.querySelectorAll(".scope-quickbtns button").forEach(btn => {
  btn.onclick = () => setScope(btn.dataset.scope);
});

// ==================== 檢索 ====================
// ==================== 檢索語法解析 ====================
// 語法：空格＝且(AND)　|＝或(OR)　!＝非(NOT)　( )＝分組
// 優先順序：括號 > ! > 空格(且) > |(或)
// 全形/半形、中英文符號皆可：! ！　| ｜　( ) （ ）　空格 全形空格
// 標點容錯：空白一律忽略；逗號類與引號/括號類標點可跳過（繁簡中英皆可）；
//   。？！ . ? 視為句子邊界，不可跨越（但查詢裡可以寫 。或？ 來要求邊界）
//   〔…〕（原文作…等小註）：可當作不存在（你們的心），也可當作存在（原文作我們）
// 英文單字：預設整字比對（man 不會命中 woman、God 不會命中 Godly）；詞前/後加 * 表示不限整字（love* → loved、*man → woman）
// 括號容錯：多出的「)」視為在整個查詢最前面補一個「(」；多出的「(」視為在最後補「)」；空括號忽略
const Q_NOT = "!！﹗";
const Q_OR  = "|｜│︱";
const Q_LP  = "(（﹙";
const Q_RP  = ")）﹚";

const Q_SKIP = "、，,﹐﹑､;；﹔:：﹕．·・‧" + "「」『』“”‘’\"'（）()［］[]【】《》〈〉﹁﹂﹃﹄〔〕〖〗｛｝{}«»‹›﹙﹚" + "\u200B\u200C\u200D\uFEFF";
const Q_BARRIER = "。｡.﹒？?﹖！!﹗";
const Q_LATIN = /[0-9A-Za-z\u00C0-\u024F]/;
const Q_SENT = "\uE000";

// 正規化：去空白、跳過標點、邊界統一成 Q_SENT、轉小寫。
// dropNotes=true：〔…〕連內容一起拿掉；false：只跳過括號本身。
// wantMap=true：同時回傳每個輸出字元對應原文的起訖位置（供標示用）
function qNormalize(text, dropNotes, wantMap) {
  let s = "";
  const st = wantMap ? [] : null, en = wantMap ? [] : null;
  const push = (str, a, b) => { s += str; if (wantMap) for (let k = 0; k < str.length; k++) { st.push(a); en.push(b); } };
  let lastLatin = false, pendingSpace = false, pendSt = 0, i = 0;
  const n = text.length;
  while (i < n) {
    const ch = String.fromCodePoint(text.codePointAt(i));
    const len = ch.length;
    if (dropNotes && ch === "〔") {
      const e = text.indexOf("〕", i + 1);
      if (e >= 0) { i = e + 1; continue; }
    }
    if (/\s/.test(ch)) { if (lastLatin && !pendingSpace) { pendingSpace = true; pendSt = i; } i += len; continue; }
    if (Q_SKIP.includes(ch)) { if (lastLatin && !pendingSpace) { pendingSpace = true; pendSt = i; } i += len; continue; }
    if (Q_BARRIER.includes(ch)) { push(Q_SENT, i, i + len); lastLatin = false; pendingSpace = false; i += len; continue; }
    const isLatin = Q_LATIN.test(ch);
    if (pendingSpace && isLatin) push(" ", pendSt, pendSt + 1); // 英文單字之間的空格保留
    pendingSpace = false;
    push(ch.toLowerCase(), i, i + len);
    lastLatin = isLatin;
    i += len;
  }
  return wantMap ? { s, st, en } : s;
}

function qTokenize(q) {
  const toks = [];
  const n = q.length;
  const isStop = (c) => /\s/.test(c) || Q_LP.includes(c) || Q_RP.includes(c) || Q_OR.includes(c) || Q_NOT.includes(c);
  let i = 0;
  while (i < n) {
    const c = q[i];
    if (/\s/.test(c)) { i++; continue; }
    if (Q_LP.includes(c))  { toks.push({ t: "LP" });  i++; continue; }
    if (Q_RP.includes(c))  { toks.push({ t: "RP" });  i++; continue; }
    if (Q_OR.includes(c))  { toks.push({ t: "OR" });  i++; continue; }
    if (Q_NOT.includes(c)) { toks.push({ t: "NOT" }); i++; continue; } // ! 不論前面有沒有空格，都是「非」
    let j = i;
    while (j < n && !isStop(q[j])) j++;
    const raw = q.slice(i, j);
    const wl = /^[*＊]/.test(raw), wr = /[*＊]$/.test(raw);   // 詞首/詞尾的 * ＝ 不限整字
    const v = qNormalize(raw.replace(/[*＊]/g, ""), false, false);
    if (v.replace(/\uE000/g, "") !== "") toks.push({ t: "TERM", v, wl, wr }); // 只剩標點的詞丟掉
    i = j;
  }
  return toks;
}

function qRepairParens(toks) {
  let depth = 0, missingOpen = 0;
  toks.forEach(k => {
    if (k.t === "LP") depth++;
    else if (k.t === "RP") { if (depth > 0) depth--; else missingOpen++; }
  });
  const out = [];
  for (let i = 0; i < missingOpen; i++) out.push({ t: "LP" });
  toks.forEach(k => out.push(k));
  for (let i = 0; i < depth; i++) out.push({ t: "RP" });
  return out;
}

function qParse(toks) {
  let p = 0;
  function parseOr() {
    const parts = [];
    const first = parseAnd();
    if (first) parts.push(first);
    while (p < toks.length && toks[p].t === "OR") {
      p++;
      const nxt = parseAnd();
      if (nxt) parts.push(nxt);
    }
    if (!parts.length) return null;
    return parts.length === 1 ? parts[0] : { op: "or", kids: parts };
  }
  function parseAnd() {
    const kids = [];
    while (p < toks.length && toks[p].t !== "OR" && toks[p].t !== "RP") {
      const u = parseUnary();
      if (u) kids.push(u);
    }
    if (!kids.length) return null;
    return kids.length === 1 ? kids[0] : { op: "and", kids };
  }
  function parseUnary() {
    const k = toks[p];
    if (k.t === "NOT") {
      p++;
      if (p >= toks.length || toks[p].t === "OR" || toks[p].t === "RP") return null;
      const u = parseUnary();
      return u ? { op: "not", kid: u } : null;
    }
    if (k.t === "LP") {
      p++;
      const e = parseOr();
      if (p < toks.length && toks[p].t === "RP") p++;
      return e;
    }
    if (k.t === "TERM") { p++; return { op: "term", v: k.v, wl: k.wl, wr: k.wr }; }
    p++; return null;
  }
  return parseOr();
}

// 在正規化後的文字 s 裡找詞 t 的位置；英文字母開頭/結尾的詞要求整字邊界（除非加了 *）
function qFindAll(s, t, firstOnly) {
  const v = t.v, res = [];
  const needL = !t.wl && Q_LATIN.test(v[0]);
  const needR = !t.wr && Q_LATIN.test(v[v.length - 1]);
  let i = s.indexOf(v);
  while (i >= 0) {
    const okL = !needL || i === 0 || !Q_LATIN.test(s[i - 1]);
    const okR = !needR || i + v.length >= s.length || !Q_LATIN.test(s[i + v.length]);
    if (okL && okR) { res.push(i); if (firstOnly) return res; }
    i = s.indexOf(v, i + 1);
  }
  return res;
}

// 不重疊出現次數（同一個詞在「且」裡重複寫 N 次 → 要求至少出現 N 處）
function qCountAll(s, t) {
  let c = 0, end = -1;
  qFindAll(s, t, false).forEach(i => { if (i >= end) { c++; end = i + t.v.length; } });
  return c;
}

function qEval(n, A, B) {
  switch (n.op) {
    case "term": return qFindAll(A, n, true).length > 0 || (B !== A && qFindAll(B, n, true).length > 0);
    case "not":  return !qEval(n.kid, A, B);
    case "and": {
      const key = k => k.v + "|" + k.wl + "|" + k.wr;
      const need = {};
      n.kids.forEach(k => { if (k.op === "term") need[key(k)] = (need[key(k)] || 0) + 1; });
      return n.kids.every(k => {
        if (k.op === "term" && need[key(k)] > 1) {
          const c = need[key(k)];
          return qCountAll(A, k) >= c || (B !== A && qCountAll(B, k) >= c);
        }
        return qEval(k, A, B);
      });
    }
    case "or":   return n.kids.some(k => qEval(k, A, B));
  }
  return false;
}

function qCollectPositive(n, neg, out) {
  if (n.op === "term") { if (!neg) out.push(n); }
  else if (n.op === "not") qCollectPositive(n.kid, !neg, out);
  else n.kids.forEach(k => qCollectPositive(k, neg, out));
}

let scriptHintDismissed = false;
function detectScript(q) {
  let s = 0, t = 0, latin = 0, cjk = 0;
  for (const ch of q) {
    if (SIMP_ONLY.has(ch)) { s++; cjk++; }
    else if (TRAD_ONLY.has(ch)) { t++; cjk++; }
    else if (/[\u4E00-\u9FFF]/.test(ch)) cjk++;
    else if (/[A-Za-z]/.test(ch)) latin++;
  }
  if (s && !t) return "s";
  if (t && !s) return "t";
  if (!cjk && latin) return "e";
  return null;   // 無法判斷（只有兩邊相同的字、或繁簡混用）
}
const SCRIPT_TARGET = { s: "cuvsimp", t: "cuv", e: "kjv" };
function updateScriptHint() {
  const box = document.getElementById("scriptHint");
  const q = document.getElementById("searchInput").value.trim();
  if (!q) scriptHintDismissed = false;
  const cur = VERSIONS.find(v => v.key === currentVersionKey);
  const d = q ? detectScript(q) : null;
  if (!d || scriptHintDismissed || !cur || cur.script === d) { box.classList.remove("show"); return; }
  const tv = VERSIONS.find(v => v.key === SCRIPT_TARGET[d]);
  const msg = { s: "偵測到簡體輸入", t: "偵測到繁體輸入", e: "Detected English input" }[d];
  document.getElementById("scriptHintMsg").textContent = d === "e"
    ? `${msg}. Switch to ${tv.label}?` : `${msg}，要切換到「${tv.label}」嗎？`;
  document.getElementById("scriptHintGo").textContent = d === "e" ? "Switch" : "切換";
  document.getElementById("scriptHintGo").dataset.key = tv.key;
  box.classList.add("show");
}
document.getElementById("searchInput").addEventListener("input", updateScriptHint);
document.getElementById("scriptHintGo").onclick = (e) => {
  const sel = document.getElementById("versionSelect");
  sel.value = e.currentTarget.dataset.key;
  sel.onchange();            // 切版本；已有查詢時會自動重新檢索
};
document.getElementById("scriptHintX").onclick = () => { scriptHintDismissed = true; updateScriptHint(); };

function runSearch() {
  const query = document.getElementById("searchInput").value.trim();
  const listEl = document.getElementById("resultList");
  const countEl = document.getElementById("resultCount");
  if (!query) { listEl.innerHTML = ""; countEl.textContent = ""; return; }

  let html = "";
  let count = 0;
  const perBook = []; // 各卷命中數，依經卷順序
  const en = isEnglishVersion(); // 英文版本：卷名與縮寫顯示英文
  BOOK_LIST.forEach(meta => {
    if (!searchScope.has(meta.id)) return;
    const book = VERSES()[meta.id];
    if (!book) return;
    let bookCount = 0;
    Object.keys(book.chapters).sort((a,b)=>+a-+b).forEach(ch => {
      const chapterData = book.chapters[ch];
      Object.keys(chapterData).sort((a,b)=>+a-+b).forEach(vn => {
        const text = chapterData[vn];
        if (!evaluateQuery(query, text)) return;
        count++;
        bookCount++;
        html += `<div class="result-item" data-book="${meta.id}" data-ch="${ch}" data-vn="${vn}">
          <span class="result-ref">${en ? meta.en : meta.zh} ${ch}:${vn}</span>
          <span class="result-text">${highlight(text, query)}</span>
        </div>`;
      });
    });
    if (bookCount) {
      const abbr = en ? meta.en3 : (FHL_BOOK_BRF[parseInt(meta.id, 10)] || meta.zh);
      perBook.push(en ? `${abbr} ${bookCount}` : `${abbr} ${bookCount}`);
    }
  });

  countEl.textContent = en
    ? `Verses ${count} found` + (perBook.length ? ` (${perBook.join("; ")})` : "")
    : `找到 ${count} ` + (perBook.length ? `（${perBook.join("；")}）節經文` : "");
  listEl.innerHTML = html || `<p style='color:#999;'>${en ? "No results" : "查無結果"}</p>`;
  listEl.querySelectorAll(".result-item").forEach(item => {
    item.onclick = () => openChapter(item.dataset.book, item.dataset.ch, item.dataset.vn);
  });
}

document.getElementById("searchBtn").onclick = runSearch;
document.getElementById("searchInput").addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });

// ==================== 頁籤切換 ====================
function switchView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(name).classList.add("active");
  document.getElementById("tabBooks").classList.toggle("active", name !== "searchView");
  document.getElementById("tabSearch").classList.toggle("active", name === "searchView");
}
document.getElementById("tabBooks").onclick = () => switchView("bookView");
document.getElementById("tabSearch").onclick = () => switchView("searchView");

// ==================== 初始化 ====================
renderVersionSelect();
renderBookGrid();
renderScopeList();
updateScopeQuickBtnState();
applyFontScale();

// 顯示版本（取自 sw.js 的 CACHE_NAME，例如 bsearch-v12 → v12）
(async function showVersion() {
  const el = document.getElementById("appVer");
  if (!el || !window.caches) return;
  try {
    const names = await caches.keys();
    const num = s => { const m = s.match(/(\d+)\D*$/); return m ? +m[1] : -1; };
    names.sort((a, b) => num(a) - num(b));
    const n = names.pop() || "";
    const m = n.match(/v\d[\w.]*$/i);
    el.textContent = m ? m[0] : n;
  } catch (e) {}
})();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
