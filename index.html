<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BSearch 查經（iPad）</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8c5e3b">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --brown:#8c5e3b;
    --brown-dark:#6e4a2e;
    --cream:#f7f3ec;
    --ink:#2a2420;
    --line:#e2d9c9;
    --accent:#a8402a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system, "PingFang TC", "Helvetica Neue", sans-serif;
    background:var(--cream);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    overscroll-behavior:none;
  }
  header{
    background:var(--brown);
    color:#fff;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  header h1{font-size:1.05em;margin:0;flex:1;font-weight:600;}
  header button{
    background:rgba(255,255,255,.15);
    border:none;color:#fff;
    padding:8px 12px;border-radius:8px;
    font-size:.95em;
  }
  header select{
    background:rgba(255,255,255,.15);
    border:none;color:#fff;
    padding:8px 10px;border-radius:8px;
    font-size:.9em;font-weight:600;
    -webkit-appearance:none;appearance:none;
  }
  #main{flex:1;overflow:hidden;position:relative;}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;}
  .view.active{display:block;}

  /* ---- 书卷选单 ---- */
  #bookView{padding:16px;}
  .testament-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
  .testament-title{font-size:1em;color:var(--brown-dark);margin:0 4px 10px;font-weight:700;}
  .book-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .book-btn{
    padding:11px 6px;text-align:center;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    font-size:.82em;font-weight:600;color:var(--ink);
    line-height:1.3;
  }
  .book-btn .en3{color:#9a8b74;font-weight:500;margin-right:3px;}
  .book-btn:active{background:var(--accent);color:#fff;}
  .book-btn:active .en3{color:#fdd;}
  @media (max-width:700px){
    .testament-cols{grid-template-columns:1fr;gap:0;}
    .testament-title{margin-top:18px;}
  }

  /* ---- 章节选单（弹层） ---- */
  #chapterSheet{
    position:fixed;inset:0;background:rgba(0,0,0,.35);
    display:none;align-items:flex-end;z-index:50;
  }
  #chapterSheet.show{display:flex;}
  .sheet-panel{
    background:#fff;width:100%;max-height:70vh;border-radius:16px 16px 0 0;
    padding:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 16px);
    overflow-y:auto;
  }
  .sheet-title{font-weight:700;font-size:1.1em;margin-bottom:12px;}
  .chapter-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .chapter-btn{
    padding:10px 0;text-align:center;background:var(--cream);
    border-radius:8px;font-weight:600;font-size:.95em;
  }
  .chapter-btn:active{background:var(--accent);color:#fff;}

  /* ---- 阅读画面 ---- */
  #readView .reader{max-width:640px;margin:0 auto;padding:20px 20px 80px;}
  #readView h2{font-size:1.3em;color:var(--brown-dark);margin:0 0 4px;}
  #readView .chnum{color:#999;font-size:.9em;margin-bottom:18px;}
  .ext-links{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:20px;}
  .ext-label{font-size:.82em;color:#9a8b74;margin-right:2px;}
  .ext-btn{
    display:inline-block;padding:5px 12px;border:1px solid var(--line);border-radius:16px;
    font-size:.82em;font-weight:600;color:var(--brown-dark);background:var(--cream);
    text-decoration:none;
  }
  .ext-btn:active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .verse{display:block;margin-bottom:.55em;line-height:1.9;font-size:1.08em;}
  .verse .vn{color:var(--accent);font-weight:700;font-size:.78em;margin-right:.3em;vertical-align:1px;}
  .verse.hit{background:linear-gradient(transparent 12%,#fff3b0 12%,#fff3b0 88%,transparent 88%);}
  .chapnav{
    display:flex;justify-content:space-between;max-width:640px;margin:0 auto;padding:0 20px 30px;
  }
  .chapnav button{
    flex:1;margin:0 6px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:1em;
  }
  .chapnav button:disabled{opacity:.35;}

  /* ---- 检索画面 ---- */
  #searchView{padding:16px;}
  .scope-panel{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:14px;
  }
  .scope-title{font-weight:700;font-size:.9em;color:var(--brown-dark);margin-bottom:8px;}
  .scope-quickbtns{display:flex;gap:8px;margin-bottom:10px;}
  .scope-quickbtns button{
    flex:1;padding:8px 0;border:1px solid var(--line);background:var(--cream);
    border-radius:8px;font-size:.85em;font-weight:600;color:var(--ink);
  }
  .scope-quickbtns button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .scope-list{
    max-height:120px;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:2px 10px;
    border-top:1px solid var(--line);padding-top:8px;
  }
  .scope-item{display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:.85em;}
  .scope-item input{flex-shrink:0;}
  .scope-item label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .scope-item label .en3{color:#9a8b74;font-weight:500;margin-right:3px;}
  .search-bar{display:flex;gap:8px;margin-bottom:6px;}
  .search-bar input{
    flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:1em;background:#fff;
  }
  .search-bar button{padding:0 18px;border:none;background:var(--accent);color:#fff;border-radius:10px;font-weight:700;}
  .search-hint{font-size:.82em;color:#8a7f6e;margin-bottom:14px;}
  .result-count{font-size:.9em;color:#6b5f4e;margin-bottom:10px;}
  .result-item{
    background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;
  }
  .result-ref{color:var(--accent);font-weight:700;font-size:.92em;display:block;margin-bottom:4px;}
  .result-text{font-size:1em;line-height:1.7;}
  mark{background:#fff3b0;color:inherit;border-radius:2px;padding:0 1px;}

  /* ---- 底部标签栏 ---- */
  nav.tabbar{
    display:flex;border-top:1px solid var(--line);background:#fff;
    padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;
  }
  nav.tabbar button{
    flex:1;padding:12px 0 10px;background:none;border:none;color:#8a7f6e;font-size:.85em;font-weight:600;
  }
  nav.tabbar button.active{color:var(--accent);}
</style>
</head>
<body>

<header>
  <h1 id="headerTitle">BSearch 查經</h1>
  <select id="versionSelect" aria-label="選擇版本"></select>
  <button id="fontMinus">A-</button>
  <button id="fontPlus">A+</button>
</header>

<div id="main">
  <!-- 书卷选单 -->
  <div id="bookView" class="view active">
    <div class="testament-cols">
      <div>
        <div class="testament-title">舊約 Old Testament</div>
        <div class="book-grid" id="otGrid"></div>
      </div>
      <div>
        <div class="testament-title">新約 New Testament</div>
        <div class="book-grid" id="ntGrid"></div>
      </div>
    </div>
  </div>

  <!-- 阅读画面 -->
  <div id="readView" class="view">
    <div class="reader" id="readerContent"></div>
    <div class="chapnav">
      <button id="prevChap">← 上一章</button>
      <button id="nextChap">下一章 →</button>
    </div>
  </div>

  <!-- 检索画面 -->
  <div id="searchView" class="view">
    <div class="scope-panel">
      <div class="scope-title">2. 選擇經卷（預設全選）</div>
      <div class="scope-quickbtns">
        <button data-scope="all">全部</button>
        <button data-scope="ot">舊約 OT</button>
        <button data-scope="nt">新約 NT</button>
      </div>
      <div class="scope-list" id="scopeList"></div>
    </div>
    <div class="search-bar">
      <input id="searchInput" placeholder="例如：耶穌 門徒 !彼得" enterkeyhint="search">
      <button id="searchBtn">檢索</button>
    </div>
    <div class="search-hint">空格 = AND　！= NOT（例：!巴力 排除含巴力的經文）</div>
    <div class="result-count" id="resultCount"></div>
    <div id="resultList"></div>
  </div>
</div>

<div id="chapterSheet">
  <div class="sheet-panel">
    <div class="sheet-title" id="sheetBookName"></div>
    <div class="chapter-grid" id="sheetChapters"></div>
  </div>
</div>

<nav class="tabbar">
  <button id="tabBooks" class="active">📖 經卷</button>
  <button id="tabSearch">🔍 檢索</button>
</nav>

<script src="data/wpCuvVerses.js"></script>
<script src="data/wpNcvVerses.js"></script>
<script src="data/wpKjvVerses.js"></script>
<script src="data/zhjUrls.js"></script>

// ==================== 版本設定 ====================
const VERSIONS = [
  { key: "cuv", label: "和合本 CUV", varName: "WPCUVVerses" },
  { key: "ncv", label: "新譯本 NCV", varName: "WPNCVVerses" },
  { key: "kjv", label: "KJV", varName: "WPKJVVerses" }
];
function getVersionData(key) {
  const v = VERSIONS.find(x => x.key === key);
  if (!v) return {};
  return (typeof window[v.varName] !== "undefined") ? window[v.varName] : {};
}

let currentVersionKey = localStorage.getItem("bsVersion") || VERSIONS[0].key;
if (!VERSIONS.some(v => v.key === currentVersionKey)) currentVersionKey = VERSIONS[0].key;

function VERSES() { return getVersionData(currentVersionKey); }

function renderVersionSelect() {
  const sel = document.getElementById("versionSelect");
  sel.innerHTML = "";
  VERSIONS.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.key;
    opt.textContent = v.label;
    sel.appendChild(opt);
  });
  sel.value = currentVersionKey;
  sel.onchange = () => {
    currentVersionKey = sel.value;
    localStorage.setItem("bsVersion", currentVersionKey);
    // 如果正在閱讀畫面，切版本後嘗試停在同一書卷/章節重新渲染
    if (current.bookId && document.getElementById("readView").classList.contains("active")) {
      openChapter(current.bookId, current.chapter);
    }
    // 如果檢索畫面有結果，重新搜一次
    if (document.getElementById("searchInput").value.trim()) runSearch();
  };
}

let current = { bookId: null, chapter: null };

// ==================== 書卷選單 ====================
function renderBookGrid() {
  const otGrid = document.getElementById("otGrid");
  const ntGrid = document.getElementById("ntGrid");
  BOOK_LIST.forEach(b => {
    const btn = document.createElement("button");
    btn.className = "book-btn";
    btn.innerHTML = `${b.id} <span class="en3">${b.en3}</span>${b.zh}`;
    btn.onclick = () => openChapterSheet(b.id);
    (b.ot ? otGrid : ntGrid).appendChild(btn);
  });
}

function openChapterSheet(bookId) {
  const book = VERSES()[bookId];
  const meta = BOOK_LIST.find(b => b.id === bookId);
  document.getElementById("sheetBookName").textContent = meta ? meta.zh : bookId;
  const grid = document.getElementById("sheetChapters");
  grid.innerHTML = "";
  if (!book) {
    grid.innerHTML = "<div style='grid-column:1/-1;color:#999;'>這個書卷還沒有索引資料</div>";
  } else {
    Object.keys(book.chapters).sort((a,b)=>+a-+b).forEach(ch => {
      const btn = document.createElement("button");
      btn.className = "chapter-btn";
      btn.textContent = ch;
      btn.onclick = () => { closeChapterSheet(); openChapter(bookId, ch); };
      grid.appendChild(btn);
    });
  }
  document.getElementById("chapterSheet").classList.add("show");
}
function closeChapterSheet(){ document.getElementById("chapterSheet").classList.remove("show"); }
document.getElementById("chapterSheet").addEventListener("click", e => {
  if (e.target.id === "chapterSheet") closeChapterSheet();
});

  { label: "YouV", build: (b, ch) => `https://www.bible.com/bible/111/${b.en3.toLowerCase()}.${ch}.NIV?parallel=1392` },
  { label: "NIrV", build: (b, ch) => `https://www.biblica.com/bible/nirv/${encodeURIComponent(b.en)}/${ch}/occbt/` },
  { label: "禱讀", build: (b, ch) => (typeof zhjBibleUrls !== "undefined" && zhjBibleUrls[b.id] && zhjBibleUrls[b.id][String(ch)]) || null },
  { label: "註解", build: (b, ch) => {
      const idx = parseInt(b.id, 10);
      const testament = idx <= 39 ? "Old Testament" : "New Testament";
      const dir = SJZ_VOL_DIR[idx];
      if (!dir) return null;
      const chPadded = String(ch).padStart(2, "0");
      return `https://www.ccbiblestudy.org/${testament}/${dir}/${b.id}CT${chPadded}.htm`;
    } },
  { label: "註釋", build: (b, ch) => {
      const idx = parseInt(b.id, 10);
      const engs = FHC_ENGS[idx];
      if (!engs) return null;
      return `https://a2z.fhl.net/php/pcom.php?book=3&engs=${engs}&chap=${ch}`;
    } },
  { label: "查經", build: (b, ch) => {
      const idx = parseInt(b.id, 10);
      const brf = FHL_BOOK_BRF[idx];
      if (!brf) return null;
      return `https://bible.fhl.net/NNUI/#/bible/${encodeURIComponent(brf)}${ch}:1`;
    } }
];

function renderExternalLinks(bookId, chapter) {
  const meta = BOOK_LIST.find(b => b.id === bookId);
  if (!meta) return "";
  let html = `<div class="ext-links"><span class="ext-label">網絡：</span>`;
  EXTERNAL_LINKS.forEach(link => {
    const url = link.build(meta, chapter);
    if (!url) return; // 對照表沒有這一章的資料就跳過，不顯示壞連結
    html += `<a class="ext-btn" href="${url}" target="_blank" rel="noopener noreferrer">${link.label}</a>`;
  });
  html += `</div>`;
  return html;
}

// ==================== 閱讀畫面 ====================
function openChapter(bookId, chapter) {
  current = { bookId, chapter: String(chapter) };
  const book = VERSES()[bookId];
  const meta = BOOK_LIST.find(b => b.id === bookId);
  const chapterData = book && book.chapters[current.chapter];

  const box = document.getElementById("readerContent");
  let html = `<h2>${meta.zh}</h2><div class="chnum">第 ${current.chapter} 章</div>`;
  html += renderExternalLinks(bookId, current.chapter);
  if (chapterData) {
    Object.keys(chapterData).sort((a,b)=>+a-+b).forEach(vn => {
      html += `<span class="verse" data-vn="${vn}"><span class="vn">${vn}</span>${escapeHtml(chapterData[vn])}</span>`;
    });
  } else {
    html += `<p style="color:#999;">這個版本找不到這一章的內容</p>`;
  }
  box.innerHTML = html;

  document.getElementById("headerTitle").textContent = `${meta.zh} ${current.chapter}章`;
  updateChapNavButtons();
  switchView("readView");
  document.getElementById("main").querySelector("#readView").scrollTop = 0;
}

function updateChapNavButtons(){
  const book = VERSES()[current.bookId];
  const chapters = book ? Object.keys(book.chapters).map(Number).sort((a,b)=>a-b) : [];
  const idx = chapters.indexOf(Number(current.chapter));
  document.getElementById("prevChap").disabled = idx <= 0;
  document.getElementById("nextChap").disabled = idx === -1 || idx >= chapters.length - 1;
  document.getElementById("prevChap").onclick = () => { if (idx > 0) openChapter(current.bookId, chapters[idx-1]); };
  document.getElementById("nextChap").onclick = () => { if (idx < chapters.length-1) openChapter(current.bookId, chapters[idx+1]); };
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ==================== 字體大小 ====================
let fontScale = parseInt(localStorage.getItem("bsFontScale")) || 100;
function applyFontScale(){
  document.querySelectorAll(".verse").forEach(el => el.style.fontSize = (fontScale/100*1.08) + "em");
  localStorage.setItem("bsFontScale", fontScale);
}
document.getElementById("fontMinus").onclick = () => { if(fontScale>70){fontScale-=10; applyFontScale();} };
document.getElementById("fontPlus").onclick = () => { if(fontScale<160){fontScale+=10; applyFontScale();} };

// ==================== 檢索範圍（經卷勾選） ====================
let activeScope = "all";          // 目前生效的分類："all" | "ot" | "nt" | null（手動勾選、不完全對應任何分類時）
let visibleScopeIds = BOOK_LIST.map(b => b.id); // 目前清單實際顯示的書卷id（依分類過濾）
let searchScope = new Set(visibleScopeIds);     // 目前被勾選、納入檢索的書卷id

function idsForMode(mode) {
  if (mode === "ot") return BOOK_LIST.filter(b => b.ot).map(b => b.id);
  if (mode === "nt") return BOOK_LIST.filter(b => !b.ot).map(b => b.id);
  return BOOK_LIST.map(b => b.id); // "all"
}

function renderScopeList() {
  const list = document.getElementById("scopeList");
  list.innerHTML = "";
  BOOK_LIST.forEach(b => {
    if (!visibleScopeIds.includes(b.id)) return; // 過濾成只顯示目前分類的書卷
    const item = document.createElement("div");
    item.className = "scope-item";
    const cbId = "scope_" + b.id;
    item.innerHTML = `<input type="checkbox" id="${cbId}" ${searchScope.has(b.id) ? "checked" : ""}>
      <label for="${cbId}">${b.id} <span class="en3">${b.en3}</span>${b.zh}</label>`;
    item.querySelector("input").addEventListener("change", (e) => {
      if (e.target.checked) searchScope.add(b.id); else searchScope.delete(b.id);
      activeScope = null; // 手動改動後不再視為完全對應某個分類按鈕
      updateScopeQuickBtnState();
    });
    list.appendChild(item);
  });
}

function setScope(mode) {
  const ids = idsForMode(mode);
  if (activeScope === mode) {
    // 再次點擊目前已生效的分類按鈕 → 清除該分類的勾選（清單維持顯示，但全部取消勾）
    ids.forEach(id => searchScope.delete(id));
    activeScope = null;
  } else {
    // 切到新分類 → 清單過濾成只顯示這個分類，且預設全選
    visibleScopeIds = ids;
    searchScope = new Set(ids);
    activeScope = mode;
  }
  renderScopeList();
  updateScopeQuickBtnState();
}

function updateScopeQuickBtnState() {
  document.querySelectorAll(".scope-quickbtns button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.scope === activeScope);
  });
}

document.querySelectorAll(".scope-quickbtns button").forEach(btn => {
  btn.onclick = () => setScope(btn.dataset.scope);
});

// ==================== 檢索 ====================
// 簡化版邏輯解析：空格=AND，!開頭=NOT，中英文皆用 includes 比對
function evaluateQuery(query, text) {
  const terms = query.trim().split(/\s+/).filter(Boolean);
  if (terms.length === 0) return false;
  return terms.every(t => {
    if (t.startsWith("!")) {
      const neg = t.slice(1);
      return neg ? !text.includes(neg) : true;
    }
    return text.includes(t);
  });
}

function highlight(text, query) {
  const terms = query.trim().split(/\s+/).filter(t => t && !t.startsWith("!"));
  let out = escapeHtml(text);
  terms.forEach(t => {
    if (!t) return;
    const esc = t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    out = out.replace(new RegExp(esc, "g"), m => `<mark>${m}</mark>`);
  });
  return out;
}

function runSearch() {
  const query = document.getElementById("searchInput").value.trim();
  const listEl = document.getElementById("resultList");
  const countEl = document.getElementById("resultCount");
  if (!query) { listEl.innerHTML = ""; countEl.textContent = ""; return; }

  let html = "";
  let count = 0;
  BOOK_LIST.forEach(meta => {
    if (!searchScope.has(meta.id)) return;
    const book = VERSES()[meta.id];
    if (!book) return;
    Object.keys(book.chapters).sort((a,b)=>+a-+b).forEach(ch => {
      const chapterData = book.chapters[ch];
      Object.keys(chapterData).sort((a,b)=>+a-+b).forEach(vn => {
        const text = chapterData[vn];
        if (!evaluateQuery(query, text)) return;
        count++;
        html += `<div class="result-item" data-book="${meta.id}" data-ch="${ch}">
          <span class="result-ref">${meta.zh} ${ch}:${vn}</span>
          <span class="result-text">${highlight(text, query)}</span>
        </div>`;
      });
    });
  });

  countEl.textContent = `找到 ${count} 處`;
  listEl.innerHTML = html || "<p style='color:#999;'>查無結果</p>";
  listEl.querySelectorAll(".result-item").forEach(item => {
    item.onclick = () => openChapter(item.dataset.book, item.dataset.ch);
  });
}
document.getElementById("searchBtn").onclick = runSearch;
document.getElementById("searchInput").addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });

// ==================== 頁籤切換 ====================
function switchView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(name).classList.add("active");
  document.getElementById("tabBooks").classList.toggle("active", name !== "searchView");
  document.getElementById("tabSearch").classList.toggle("active", name === "searchView");
  if (name === "bookView") document.getElementById("headerTitle").textContent = "BSearch 查經";
  if (name === "searchView") document.getElementById("headerTitle").textContent = "聖經檢索";
}
document.getElementById("tabBooks").onclick = () => switchView("bookView");
document.getElementById("tabSearch").onclick = () => switchView("searchView");

// ==================== 初始化 ====================
renderVersionSelect();
renderBookGrid();
renderScopeList();
updateScopeQuickBtnState();
applyFontScale();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
